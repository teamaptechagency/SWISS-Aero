<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<style>
  input,textarea,button{font-family:'IBM Plex Sans',sans-serif}
</style>
</helmet>

<sc-if value="{{ chatOpen }}">
<div style="{{ chatPanelStyle }}">
  <div style="flex:none;background:#14161B;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="font-size:13.5px;font-weight:600">Live chat</div>
      <div style="font-size:11px;color:rgba(255,255,255,.55)">Swiss Aero · usually replies in minutes</div>
    </div>
    <button onClick="{{ toggleChat }}" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;opacity:.75;padding:0;line-height:1">✕</button>
  </div>

  <sc-if value="{{ showForm }}">
  <div style="flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px">
    <div style="font-size:13px;color:rgba(20,22,27,.6);line-height:1.5">Tell us a bit about yourself and we'll get back to you.</div>
    <div>
      <div style="font-size:11px;font-weight:600;color:rgba(20,22,27,.5);margin-bottom:5px">NAME</div>
      <input value="{{ name }}" onChange="{{ onNameChange }}" placeholder="Your name" style="width:100%;border:1px solid rgba(20,22,27,.15);border-radius:8px;padding:9px 12px;font-size:13px;outline:none"></input>
    </div>
    <div>
      <div style="font-size:11px;font-weight:600;color:rgba(20,22,27,.5);margin-bottom:5px">EMAIL</div>
      <input value="{{ email }}" onChange="{{ onEmailChange }}" placeholder="you@example.com" style="width:100%;border:1px solid rgba(20,22,27,.15);border-radius:8px;padding:9px 12px;font-size:13px;outline:none"></input>
    </div>
    <div>
      <div style="font-size:11px;font-weight:600;color:rgba(20,22,27,.5);margin-bottom:5px">MESSAGE</div>
      <textarea value="{{ message }}" onChange="{{ onMessageChange }}" placeholder="How can we help?" rows="4" style="width:100%;border:1px solid rgba(20,22,27,.15);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;resize:vertical;font-family:'IBM Plex Sans',sans-serif"></textarea>
    </div>
  </div>
  <div style="flex:none;padding:12px 16px;border-top:1px solid rgba(20,22,27,.09)">
    <button onClick="{{ startChat }}" style="{{ startBtnStyle }}">Start chat</button>
  </div>
  </sc-if>

  <sc-if value="{{ showConversation }}">
  <div style="flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{ chatMessages }}" as="m" hint-placeholder-count="2">
    <div style="{{ m.wrapStyle }}">
      <div style="{{ m.bubbleStyle }}">{{ m.text }}</div>
      <div style="font-size:10px;color:rgba(20,22,27,.4);margin-top:3px">{{ m.time }}</div>
    </div>
    </sc-for>
    <sc-if value="{{ chatTyping }}">
    <div style="font-size:11.5px;color:rgba(20,22,27,.45);font-style:italic">Swiss Aero is typing…</div>
    </sc-if>
  </div>
  <div style="flex:none;padding:10px;border-top:1px solid rgba(20,22,27,.09);display:flex;gap:8px">
    <input value="{{ chatInput }}" onChange="{{ onChatInputChange }}" placeholder="Type a message…" style="flex:1;border:1px solid rgba(20,22,27,.15);border-radius:20px;padding:9px 14px;font-size:12.5px;outline:none"></input>
    <button onClick="{{ sendChat }}" style="background:#C1391F;color:#fff;border:none;border-radius:20px;padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer">Send</button>
  </div>
  </sc-if>
</div>
</sc-if>

<sc-if value="{{ chatClosed }}">
<button onClick="{{ toggleChat }}" style="{{ chatFabStyle }}">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"></path></svg>
</button>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:520}}">
class Component extends DCLogic {
  state = {
    open: false, view: 'form',
    name: '', email: '', message: '',
    chatInput: '', chatTyping: false,
    messages: []
  };

  componentDidMount(){
    try {
      const session = JSON.parse(localStorage.getItem('sa_client_session') || 'null');
      if (session && session.name) {
        this.setState({
          view: 'conversation',
          name: session.name, email: session.email || '',
          messages: [{from:'them', text:'Welcome back, '+session.name.split(' ')[0]+'! How can we help today?', time:'Just now', mine:false}]
        });
        return;
      }
    } catch(e) {}
    try {
      const lead = JSON.parse(localStorage.getItem('sa_chat_lead') || 'null');
      if (lead && lead.name && lead.messages && lead.messages.length) {
        this.setState({ view:'conversation', name: lead.name, email: lead.email, messages: lead.messages });
      }
    } catch(e) {}
  }
  componentWillUnmount(){ clearTimeout(this._t); }

  toggleChat = () => this.setState(s=>({open:!s.open}));
  onNameChange = (e) => this.setState({name:e.target.value});
  onEmailChange = (e) => this.setState({email:e.target.value});
  onMessageChange = (e) => this.setState({message:e.target.value});
  onChatInputChange = (e) => this.setState({chatInput:e.target.value});

  persistLead = (name, email, messages) => {
    try { localStorage.setItem('sa_chat_lead', JSON.stringify({name:name, email:email, messages:messages})); } catch(e) {}
  };

  startChat = () => {
    const name = this.state.name.trim(), email = this.state.email.trim(), text = this.state.message.trim();
    if (!name || !email || !text) return;
    const messages = [{from:'me', text:text, time:'Just now', mine:true}];
    this.setState({ view:'conversation', messages:messages, message:'', chatTyping:true });
    this.persistLead(name, email, messages);
    clearTimeout(this._t);
    this._t = setTimeout(()=>{
      const reply = {from:'them', text:'Thanks '+name.split(' ')[0]+' — one of our accountants will reply by email shortly.', time:'Just now', mine:false};
      this.setState(s=>{
        const nextMessages = s.messages.concat([reply]);
        this.persistLead(s.name, s.email, nextMessages);
        return {chatTyping:false, messages:nextMessages};
      });
    }, 1400);
  };

  sendChat = () => {
    const text = this.state.chatInput.trim(); if(!text) return;
    const messages = this.state.messages.concat([{from:'me', text:text, time:'Just now', mine:true}]);
    this.setState({messages:messages, chatInput:'', chatTyping:true});
    this.persistLead(this.state.name, this.state.email, messages);
    clearTimeout(this._t);
    this._t = setTimeout(()=>{
      const reply = {from:'them', text:'Got it — thanks for the extra detail, we’ll follow up by email shortly.', time:'Just now', mine:false};
      this.setState(s=>{
        const nextMessages = s.messages.concat([reply]);
        this.persistLead(s.name, s.email, nextMessages);
        return {chatTyping:false, messages:nextMessages};
      });
    }, 1400);
  };

  renderVals(){
    const s = this.state;
    const chatMessages = s.messages.map(m => ({
      ...m,
      wrapStyle: 'max-width:82%;'+(m.mine?'align-self:flex-end;margin-left:auto;text-align:right':'align-self:flex-start'),
      bubbleStyle: m.mine
        ? 'background:#C1391F;color:#fff;padding:9px 13px;border-radius:12px 12px 2px 12px;font-size:12.5px;line-height:1.45;text-align:left'
        : 'background:#F0EEE8;color:#14161B;padding:9px 13px;border-radius:12px 12px 12px 2px;font-size:12.5px;line-height:1.45'
    }));
    const canStart = !!(s.name.trim() && s.email.trim() && s.message.trim());
    return {
      chatOpen: s.open, chatClosed: !s.open, toggleChat: this.toggleChat,
      showForm: s.view==='form', showConversation: s.view==='conversation',
      name: s.name, onNameChange: this.onNameChange,
      email: s.email, onEmailChange: this.onEmailChange,
      message: s.message, onMessageChange: this.onMessageChange,
      startChat: this.startChat,
      startBtnStyle: 'width:100%;padding:13px;border:none;border-radius:9px;font-size:13.5px;font-weight:600;'+(canStart?'background:#C1391F;color:#fff;cursor:pointer':'background:#E4E1DA;color:rgba(20,22,27,.4);cursor:not-allowed'),
      chatMessages: chatMessages, chatTyping: s.chatTyping,
      chatInput: s.chatInput, onChatInputChange: this.onChatInputChange, sendChat: this.sendChat,
      chatFabStyle: 'position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:#C1391F;color:#fff;border:none;box-shadow:0 10px 28px rgba(193,57,31,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:60',
      chatPanelStyle: 'position:fixed;bottom:24px;right:24px;width:330px;height:440px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);border:1px solid rgba(20,22,27,.1);display:flex;flex-direction:column;z-index:60;overflow:hidden'
    };
  }
}
</script>
</body>
</html>
