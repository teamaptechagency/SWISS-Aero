<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
</style>
</helmet>
<div style="width:100%;position:relative">
  <div style="{{ topStripStyle }}">
    <div style="max-width:1200px;margin:0 auto;padding:0 40px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;white-space:nowrap">
      <span style="overflow:hidden;text-overflow:ellipsis">ICAEW-regulated · ICO registered ZB294817</span>
      <a href="tel:02038904471" style="color:rgba(255,255,255,.72);flex:none">020 3890 4471</a>
    </div>
  </div>

  <div style="background:#F3F1EC;border-bottom:1px solid rgba(20,22,27,.09);position:sticky;top:0;z-index:30">
    <div style="max-width:1200px;margin:0 auto;padding:0 40px;height:74px;display:flex;align-items:center;justify-content:space-between">
      <a href="index.html" style="display:flex;align-items:center;gap:11px;color:#14161B">
        <div style="width:34px;height:34px;background:#C1391F;border-radius:8px;position:relative;flex:none">
          <div style="position:absolute;left:6px;top:16px;width:22px;height:3.5px;background:#fff;transform:rotate(-28deg);border-radius:2px"></div>
          <div style="position:absolute;left:12px;top:22px;width:12px;height:3px;background:rgba(255,255,255,.55);transform:rotate(-28deg);border-radius:2px"></div>
        </div>
        <div>
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;letter-spacing:-.015em;line-height:1.1">Swiss Aero</div>
          <div style="font-size:9.5px;letter-spacing:.14em;color:rgba(20,22,27,.45);font-weight:600">ACCOUNTANTS</div>
        </div>
      </a>
      <div style="{{ desktopNavStyle }}">
        <a href="Services.dc.html" style="{{ linkServices }}">Services</a>
        <a href="Pricing.dc.html" style="{{ linkPricing }}">Pricing</a>
        <a href="About.dc.html" style="{{ linkAbout }}">About</a>
        <a href="Insights.dc.html" style="{{ linkInsights }}">Insights</a>
        <a href="Contact.dc.html" style="{{ linkContact }}">Contact</a>
        <div style="display:flex;align-items:center;gap:10px;margin-left:6px">
          <a href="client-portal.html" style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#40434C;border:1px solid rgba(20,22,27,.18);padding:9px 15px;border-radius:8px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
            Client login
          </a>
          <a href="Quote.dc.html" style="background:#C1391F;color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:8px">Get my quote</a>
        </div>
      </div>
      <button onClick="{{ toggleMenu }}" style="{{ hamburgerStyle }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14161B" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
      </button>
    </div>
  </div>

  <sc-if value="{{ mobileMenuOpen }}">
  <div style="position:absolute;top:100%;left:0;right:0;z-index:40;background:#fff;border-bottom:1px solid rgba(20,22,27,.09);padding:8px 20px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:0 16px 28px rgba(0,0,0,.14)">
    <a href="Services.dc.html" style="padding:12px 4px;font-size:15px;font-weight:600;color:#14161B;border-bottom:1px solid rgba(20,22,27,.06)">Services</a>
    <a href="Pricing.dc.html" style="padding:12px 4px;font-size:15px;font-weight:600;color:#14161B;border-bottom:1px solid rgba(20,22,27,.06)">Pricing</a>
    <a href="About.dc.html" style="padding:12px 4px;font-size:15px;font-weight:600;color:#14161B;border-bottom:1px solid rgba(20,22,27,.06)">About</a>
    <a href="Insights.dc.html" style="padding:12px 4px;font-size:15px;font-weight:600;color:#14161B;border-bottom:1px solid rgba(20,22,27,.06)">Insights</a>
    <a href="Contact.dc.html" style="padding:12px 4px;font-size:15px;font-weight:600;color:#14161B;border-bottom:1px solid rgba(20,22,27,.06)">Contact</a>
    <a href="client-portal.html" style="display:flex;align-items:center;gap:8px;margin-top:10px;padding:13px 15px;font-size:14px;font-weight:600;color:#40434C;border:1px solid rgba(20,22,27,.18);border-radius:9px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      Client login
    </a>
    <a href="Quote.dc.html" style="text-align:center;margin-top:8px;background:#C1391F;color:#fff;font-size:14px;font-weight:600;padding:13px;border-radius:9px">Get my quote</a>
  </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:124},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;services&quot;,&quot;pricing&quot;,&quot;about&quot;,&quot;insights&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { isMobile: false, menuOpen: false };
  componentDidMount(){
    this.check();
    this._onResize = () => this.check();
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount(){ window.removeEventListener('resize', this._onResize); }
  check(){ if(this.props.forceMobile!=null) return; const m = window.innerWidth < 900; if(m !== this.state.isMobile) this.setState({isMobile:m, menuOpen: m ? this.state.menuOpen : false}); }
  toggleMenu = () => this.setState(s=>({menuOpen:!s.menuOpen}));

  renderVals(){
    const active = this.props.active || '';
    const s = this.state;
    const effMobile = this.props.forceMobile!=null ? this.props.forceMobile : s.isMobile;
    const style = (key) => 'font-size:13.5px;font-weight:'+(active===key?'600':'500')+';color:'+(active===key?'#C1391F':'#40434C');
    return {
      linkServices: style('services'),
      linkPricing: style('pricing'),
      linkAbout: style('about'),
      linkInsights: style('insights'),
      linkContact: style('contact'),
      topStripStyle: 'background:#14161B;color:rgba(255,255,255,.72);font-size:'+(effMobile?'10.5px':'12.5px')+';padding:'+(effMobile?'7px 0':'9px 0'),
      desktopNavStyle: 'display:'+(effMobile?'none':'flex')+';align-items:center;gap:28px',
      hamburgerStyle: 'display:'+(effMobile?'flex':'none')+';align-items:center;justify-content:center;background:none;border:1px solid rgba(20,22,27,.15);border-radius:8px;width:40px;height:40px;cursor:pointer',
      toggleMenu: this.toggleMenu,
      mobileMenuOpen: effMobile && s.menuOpen
    };
  }
}

</script>
</body>
</html>
